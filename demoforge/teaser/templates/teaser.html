<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-__SCRIPT_HASH__'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; media-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Motion-design teaser preview</title>
<style>
* { box-sizing: border-box; letter-spacing: 0; }
html, body { margin: 0; background: #080e12; }
body { font-family: 'Segoe UI', 'Trebuchet MS', sans-serif; }
#viewport { width: 100%; overflow: hidden; }
#canvas { position: relative; width: 1920px; height: 1080px; transform-origin: top left;
  overflow: hidden; background: #080e12; color: #f5fafb; --accent: #64dfc4; }
#canvas.feature { background: linear-gradient(120deg, #102931, #080e12 65%); }
#canvas.feature.spread { background: linear-gradient(120deg, #153f46, #101c2b 75%); }
#canvas.feature.focus { background: #e7f4f2; color: #101d22; --accent: #126555; }
#canvas.end { background: #080e12; color: #f5fafb; --accent: #64dfc4; }
header { position: absolute; top: 54px; left: 96px; right: 96px; display: flex;
  align-items: flex-start; justify-content: space-between; gap: 48px; font-size: 22px; }
#label { flex-shrink: 0; }
#identity { max-width: 680px; overflow-wrap: anywhere; text-align: right; }
#rule { position: absolute; left: 96px; right: 96px; top: 146px; height: 1px;
  background: currentColor; opacity: .3; }
#content { position: absolute; z-index: 2; left: 96px; top: 202px; width: 1728px; height: 626px; }
#eyebrow { margin: 0 0 26px; font: 20px/1.4 Consolas, monospace; color: var(--accent); }
#headline-mask { width: 100%; height: 320px; overflow: hidden; }
h1 { margin: 0; height: 100%; font-size: 164px; line-height: 1.03; font-weight: 700;
  overflow-wrap: anywhere; white-space: pre-wrap; }
#caption { margin: 34px 0 0; font-size: 50px; line-height: 1.22; width: 1120px;
  height: 192px; white-space: pre-wrap; overflow-wrap: anywhere; }
#marker { position: absolute; bottom: 0; right: 0; width: 440px; height: 14px;
  background: var(--accent); transform-origin: left; }
#canvas.title #caption { color: #b7d2d3; }
#canvas.feature #content { width: 1620px; top: 238px; height: 568px; }
#canvas.feature #headline-mask { height: 474px; }
#canvas.feature h1 { font-size: 132px; line-height: 1.1; font-weight: 700; }
#canvas.feature.spread h1 { max-width: 1400px; }
#canvas.feature.focus h1 { text-align: center; }
#canvas.feature #caption { display: none; }
#canvas.feature #marker { left: 0; width: 160px; height: 5px; }
#canvas.end #content { top: 240px; }
#canvas.end h1 { font-size: 146px; }
#canvas.end #caption { color: #64dfc4; width: 1460px; }
#canvas.end #marker { width: 1728px; height: 3px; }
#illustration { position: absolute; inset: 164px 0 190px; pointer-events: none; display: none; }
#canvas.feature #illustration { display: block; }
.trail { position: absolute; top: 82%; left: -20%; width: 150%; height: 2px;
  background: linear-gradient(90deg, transparent, #64dfc4 60%, transparent);
  transform-origin: 70% 50%; opacity: .36; }
.trail:nth-child(2) { top: 88%; }
.trail:nth-child(3) { top: 95%; height: 4px; }
.trail:nth-child(4) { top: 12%; }
.trail:nth-child(5) { top: 18%; }
#canvas.focus .trail { background: linear-gradient(90deg, transparent, #126555, transparent); }
footer { position: absolute; left: 96px; right: 96px; bottom: 48px; border-top: 1px solid;
  padding-top: 20px; display: grid; grid-template-columns: 3fr 2fr; gap: 10px 64px;
  font-family: Consolas, 'Courier New', monospace; font-size: 18px; line-height: 1.4; }
footer p { margin: 0; overflow-wrap: anywhere; }
#revision { text-align: right; }
#source { grid-column: 1 / -1; font-size: 16px; }
@media (max-width: 799px) {
  #canvas { width: 100%; height: 1200px; transform: none !important; }
  header { top: 24px; left: 24px; right: 24px; font-size: 12px; gap: 12px; flex-direction: column; }
  #identity { text-align: left; max-width: 100%; }
  #rule { top: 114px; left: 24px; right: 24px; }
  #content, #canvas.feature #content, #canvas.end #content { top: 154px; left: 24px;
    width: calc(100% - 48px); height: 458px; }
  #eyebrow { font-size: 13px; margin-bottom: 22px; }
  #headline-mask { height: 196px; }
  h1, #canvas.end h1 { font-size: 48px; line-height: 1.08; }
  #caption, #canvas.end #caption { width: 100%; font-size: 25px; height: 180px; margin-top: 24px; }
  #marker, #canvas.end #marker { width: 100%; height: 4px; }
  #canvas.feature #headline-mask { height: 284px; }
  #canvas.feature h1 { font-size: 42px; }
  #canvas.feature #content { height: 340px; }
  #illustration { inset: 128px 0 414px; }
  footer { left: 24px; right: 24px; top: 816px; bottom: auto; font-size: 12px;
    display: flex; flex-direction: column; gap: 8px; padding-top: 16px; }
  #revision { text-align: left; }
  #source { font-size: 12px; }
}
</style>
</head>
<body>
<main id="viewport" aria-label="Source-linked motion-design teaser">
  <article id="canvas">
    <header><span id="label">Motion-design teaser / Not a recording</span><span id="identity"></span></header>
    <div id="rule" aria-hidden="true"></div>
    <section id="content" aria-label="Documented repository text">
      <p id="eyebrow"></p>
      <div id="marker" aria-hidden="true"></div>
      <div id="headline-mask"><h1 id="headline"></h1></div>
      <p id="caption"></p>
    </section>
    <div id="illustration" aria-hidden="true">
      <div class="trail" data-trail></div><div class="trail" data-trail></div>
      <div class="trail" id="trail-focus" data-trail></div>
      <div class="trail" data-trail></div><div class="trail" data-trail></div>
    </div>
    <footer><p id="evidence"></p><p id="revision"></p><p id="source"></p></footer>
  </article>
</main>

</body>
</html>
